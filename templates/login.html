{% extends "auth_base.html" %}
{% block content %}<header class="auth-heading"><span class="eyebrow">WELCOME BACK</span><h1>欢迎回来</h1><p>登录管理员账号，继续照看你的群组</p></header>
<form method="post" action="/login" class="setup_input"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="field"><label for="username">用户名</label><input id="username" name="username" value="{{ username }}" autocomplete="username" pattern="[A-Za-z0-9_]{3,32}" minlength="3" maxlength="32" placeholder="请输入管理员用户名" required></div>
<div class="field"><label for="password">密码</label><div class="password-field"><input id="password" type="password" name="password" autocomplete="current-password" minlength="8" maxlength="128" placeholder="请输入密码" required><button type="button" class="password-toggle" data-password="password" aria-label="显示密码" aria-pressed="false"><img src="{{ url_for('static', path='/images/eye.svg').path }}" alt=""></button></div></div><button type="submit" class="setup_input_btn">登录</button></form>
<p class="auth-note">仅限此实例的管理员登录</p>{% endblock %}
