<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page_title }}</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/images/logo.svg').path }}">
<link rel="stylesheet" href="{{ url_for('static', path='/css/auth.css').path }}?v=20261013-10">
<link rel="stylesheet" href="{{ url_for('static', path='/css/toast.css').path }}">
<script src="{{ url_for('static', path='/js/toast.js').path }}?v=20261012-4" defer></script>
<script src="{{ url_for('static', path='/js/auth.js').path }}?v=20261013-10" defer></script>
<link rel="stylesheet" href="{{ url_for('static', path='/css/responsive.css').path }}?v=3">
<link rel="stylesheet" href="{{ url_for('static', path='/css/navigation.css').path }}?v=3">
<script src="{{ url_for('static', path='/js/navigation.js').path }}?v=2" defer></script>
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', path='/images/apple-touch-icon.png').path }}">
</head>
<body>
{% if success %}<div class="error_toast success_toast" role="status">{{ success }}</div>{% endif %}
{% if error %}<div class="error_toast" role="alert">{{ error }}</div>{% endif %}
<main class="auth-layout">
<aside class="brand-panel">
<a class="brand" href="/login"><img src="{{ url_for('static', path='/images/logo.svg').path }}" alt="">黑猫群管</a>
<div class="brand-story">
<div class="cat-scene" aria-label="悬停小猫了解黑猫群管">
<button type="button" class="cat cat-back" data-cat-message="想进群？先过我这关喵～按钮验证、算术验证，我都会" aria-label="验证猫：了解入群验证" aria-expanded="false"><span class="cat-ear ear-left" aria-hidden="true"></span><span class="cat-ear ear-right" aria-hidden="true"></span><i aria-hidden="true"></i><i aria-hidden="true"></i><span class="cat-face" aria-hidden="true"><span class="cat-nose"></span><span class="cat-mouth"></span><span class="whiskers whiskers-left"></span><span class="whiskers whiskers-right"></span></span><span class="cat-chest" aria-hidden="true"></span><span class="cat-paws" aria-hidden="true"></span></button>
<button type="button" class="cat cat-middle" data-cat-message="广告想偷偷溜进来？关键词加 AI，我来帮你盯着喵" aria-label="守卫猫：了解广告拦截" aria-expanded="false"><span class="cat-ear ear-left" aria-hidden="true"></span><span class="cat-ear ear-right" aria-hidden="true"></span><i aria-hidden="true"></i><i aria-hidden="true"></i><span class="cat-face" aria-hidden="true"><span class="cat-nose"></span><span class="cat-mouth"></span><span class="whiskers whiskers-left"></span><span class="whiskers whiskers-right"></span></span><span class="cat-chest" aria-hidden="true"></span><span class="cat-paws" aria-hidden="true"></span></button>
<button type="button" class="cat cat-front" data-cat-message="到点喊我喵！每日定时、间隔广播，群消息我来送" aria-label="广播猫：了解群广播" aria-expanded="false"><span class="cat-ear ear-left" aria-hidden="true"></span><span class="cat-ear ear-right" aria-hidden="true"></span><i aria-hidden="true"></i><i aria-hidden="true"></i><span class="cat-face" aria-hidden="true"><span class="cat-nose"></span><span class="cat-mouth"></span><span class="whiskers whiskers-left"></span><span class="whiskers whiskers-right"></span></span><span class="cat-chest" aria-hidden="true"></span><span class="cat-paws" aria-hidden="true"></span></button>
<button type="button" class="cat cat-small" data-cat-message="谁验证了、哪条被拦了？翻翻事件日志，我都记着喵" aria-label="记录猫：了解事件日志" aria-expanded="false"><span class="cat-ear ear-left" aria-hidden="true"></span><span class="cat-ear ear-right" aria-hidden="true"></span><i aria-hidden="true"></i><i aria-hidden="true"></i><span class="cat-face" aria-hidden="true"><span class="cat-nose"></span><span class="cat-mouth"></span><span class="whiskers whiskers-left"></span><span class="whiskers whiskers-right"></span></span><span class="cat-chest" aria-hidden="true"></span><span class="cat-paws" aria-hidden="true"></span></button>
<div class="cat-bubble" role="status" aria-live="polite" hidden></div>
</div>
</div>
<a class="opensource" href="https://github.com/Ponon/BlackCatGuard" target="_blank" rel="noopener noreferrer"><img src="{{ url_for('static', path='/images/github.svg').path }}" alt="">基于黑猫群管开源构建</a>
</aside>
<section class="auth-main"><div class="auth-content {% block width %}{% endblock %}">{% block content %}{% endblock %}</div></section>
</main></body></html>
