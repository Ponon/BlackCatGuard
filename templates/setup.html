<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/style.css') }}"
    >
</head>
<body>
    <main class="container">
        <h1>创建管理员</h1>
        <p>该账号用于登录山雀群管后台。</p>

        {% if error %}
            <p role="alert">{{ error }}</p>
        {% endif %}

        <form method="post" action="/setup">
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token }}"
            >

            <div>
                <label for="username">账号</label>
                <input
                    id="username"
                    name="username"
                    value="{{ username }}"
                    autocomplete="username"
                    pattern="[A-Za-z0-9_]{3,32}"
                    minlength="3"
                    maxlength="32"
                    required
                >
            </div>

            <div>
                <label for="password">密码</label>
                <input
                    id="password"
                    type="password"
                    name="password"
                    autocomplete="new-password"
                    minlength="12"
                    maxlength="128"
                    required
                >
            </div>

            <div>
                <label for="confirm_password">确认密码</label>
                <input
                    id="confirm_password"
                    type="password"
                    name="confirm_password"
                    autocomplete="new-password"
                    minlength="12"
                    maxlength="128"
                    required
                >
            </div>

            <button type="submit">创建管理员</button>
        </form>
    </main>
</body>
</html>
