name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test and start image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies and run tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -q
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: blackcatguard:smoke
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Verify startup and persistent data permissions
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker volume create smoke-data
          docker run -d --name smoke --platform "linux/$ARCH" -v smoke-data:/app/data blackcatguard:smoke
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            if [ "$status" = healthy ]; then
              docker exec smoke python -c "from pathlib import Path; assert Path('/app/data/session.key').is_file(); assert Path('/app/data/blackcatguard.db').is_file()"
              exit 0
            fi
            sleep 3
          done
          docker logs smoke
          exit 1
      - name: Clean up test container
        if: always()
        run: |
          docker logs smoke || true
          docker rm -f smoke || true
          docker volume rm smoke-data || true

  publish:
    name: Publish to GHCR
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Set lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
      - name: Build and publish both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
      - name: Publish summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo '### Published Docker images' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$TAGS" >> "$GITHUB_STEP_SUMMARY"
