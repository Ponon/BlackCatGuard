services:
  blackcatguard:
    container_name: blackcatguard
    image: ghcr.io/ponon/blackcatguard:latest
    environment:
      APP_ACCESS_URL: "http://${ACCESS_HOST:-宿主机IP}:${PORT:-1777}"
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-1777}:1777"
    volumes:
      - data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 30s

volumes:
  data:
